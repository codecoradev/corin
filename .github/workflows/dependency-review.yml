name: Dependency Review

# GitHub's standard PR gate: flags dependencies with known vulnerabilities
# or license issues at review time. Free for public repositories.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
